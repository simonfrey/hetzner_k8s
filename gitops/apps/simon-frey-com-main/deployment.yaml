apiVersion: apps/v1
kind: Deployment
metadata:
  name: simon-frey-com-main
spec:
  replicas: 1
  selector:
    matchLabels:
      app: simon-frey-com-main
  template:
    metadata:
      labels:
        app: simon-frey-com-main
    spec:
      initContainers:
        - name: git-sync-init
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          args:
            - --repo=git@github.com:simonfrey/simon-frey.com.git
            - --root=/srv/site
            - --link=current
            - --one-time
            - --max-failures=5
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts=false
          volumeMounts:
            - name: site-content
              mountPath: /srv/site
            - name: git-ssh
              mountPath: /etc/git-secret
              readOnly: true
          securityContext:
            runAsUser: 65533
        - name: seed-cache
          image: php:8.2-apache
          command: ["/bin/bash", "-c", "cp -rn /srv/site/current/links/cache/* /srv/links-cache/ 2>/dev/null; cp -rn /srv/site/current/links/imgs/* /srv/links-cache/imgs/ 2>/dev/null; chown -R www-data:www-data /srv/links-cache; true"]
          volumeMounts:
            - name: site-content
              mountPath: /srv/site
              readOnly: true
            - name: links-cache
              mountPath: /srv/links-cache
      containers:
        - name: apache-php
          image: php:8.2-apache
          command: ["/bin/bash", "-c", "a2enmod headers rewrite && sed -i 's|/var/www/html|/srv/site/current|g' /etc/apache2/sites-available/000-default.conf /etc/apache2/apache2.conf && echo '<Directory /srv/site/current>\n    AllowOverride All\n    Require all granted\n</Directory>' >> /etc/apache2/apache2.conf && apache2-foreground"]
          ports:
            - containerPort: 80
          env:
            - name: LINKS_CACHE_DIR
              value: /srv/links-cache
          volumeMounts:
            - name: site-content
              mountPath: /srv/site
              readOnly: true
            - name: links-env
              mountPath: /srv/links-env
              readOnly: true
            - name: links-cache
              mountPath: /srv/links-cache
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4.4.0
          args:
            - --repo=git@github.com:simonfrey/simon-frey.com.git
            - --root=/srv/site
            - --link=current
            - --period=60s
            - --stale-worktree-timeout=120s
            - --ssh-key-file=/etc/git-secret/ssh
            - --ssh-known-hosts=false
            - --webhook-url=http://nginx-cache.simon-frey-com.svc:8080/purge
            - --webhook-method=POST
            - --max-failures=5
          volumeMounts:
            - name: site-content
              mountPath: /srv/site
            - name: git-ssh
              mountPath: /etc/git-secret
              readOnly: true
          securityContext:
            runAsUser: 65533
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      volumes:
        - name: site-content
          emptyDir: {}
        - name: links-cache
          emptyDir: {}
        - name: git-ssh
          secret:
            secretName: git-sync-ssh
            defaultMode: 0444
        - name: links-env
          secret:
            secretName: links-env
            defaultMode: 0440
