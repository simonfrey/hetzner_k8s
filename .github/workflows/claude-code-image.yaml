name: Claude Code Image

on:
  push:
    branches: [main]
    paths:
      - "docker/claude-code/**"
      - ".github/workflows/claude-code-image.yaml"
  pull_request:
    paths:
      - "docker/claude-code/**"
      - ".github/workflows/claude-code-image.yaml"
  workflow_dispatch: # Allow manual trigger

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build image locally for testing
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker/claude-code
          load: true
          tags: claude-code:test

      # Smoke test the container directly (no Kubernetes — ArgoCD handles deployment)
      - name: Smoke test
        run: |
          set -euo pipefail

          # Generate a test SSH keypair
          ssh-keygen -t ed25519 -f /tmp/test-key -N ""
          mkdir -p /tmp/claude-home /tmp/authorized_keys
          # Docker doesn't have K8s fsGroup — fix ownership for UID 10001
          sudo chown 10001:10001 /tmp/claude-home
          cp /tmp/test-key.pub /tmp/authorized_keys/authorized_keys

          # In K8s, sshd listens on 127.0.0.1 and kubectl port-forward reaches
          # loopback directly. Docker -p maps to eth0, not loopback, so we
          # override ListenAddress for CI only.
          sed 's/ListenAddress 127.0.0.1/ListenAddress 0.0.0.0/' \
            docker/claude-code/sshd_config > /tmp/ci-sshd_config

          # Run the container the same way K8s will (non-root, read-only rootfs)
          docker run -d --name claude-test \
            --read-only \
            --tmpfs /tmp --tmpfs /run/sshd \
            -v /tmp/claude-home:/home/claude \
            -v /tmp/authorized_keys:/etc/ssh/authorized_keys:ro \
            -v /tmp/ci-sshd_config:/etc/ssh/sshd_config:ro \
            -p 2222:2222 \
            claude-code:test

          # Wait for sshd to start
          for i in $(seq 1 15); do
            if docker exec claude-test ss -tlnp 2>/dev/null | grep -q 2222; then break; fi
            if ! docker inspect claude-test --format='{{.State.Running}}' | grep -q true; then
              echo "Container crashed! Logs:"
              docker logs claude-test
              exit 1
            fi
            sleep 1
          done

          echo "--- Claude Code installed ---"
          docker exec claude-test claude --version

          echo "--- Running as non-root (UID 10001) ---"
          UID_VAL=$(docker exec claude-test id -u)
          [ "$UID_VAL" = "10001" ] || { echo "FAIL: UID=$UID_VAL"; exit 1; }

          echo "--- sshd listening on 2222 ---"
          docker exec claude-test ss -tlnp | grep 2222 || \
            { echo "FAIL: sshd not on 2222"; exit 1; }

          echo "--- SSH pubkey auth works ---"
          ssh -i /tmp/test-key -p 2222 \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            claude@localhost whoami | grep claude || \
            { echo "FAIL: SSH auth"; exit 1; }

          echo "All smoke tests passed!"
          docker rm -f claude-test

      # Push to GHCR only on merge to main
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: docker/claude-code
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/claude-code:latest
            ghcr.io/${{ github.repository }}/claude-code:${{ github.sha }}
