apiVersion: apps/v1
kind: Deployment
metadata:
  name: kwatch
  namespace: kwatch
spec:
  # Single writer (Lease); maxSurge 0 so two pods never run side by side.
  # (Not "Recreate": server-side apply keeps the live rollingUpdate defaults,
  # which the API rejects together with Recreate.)
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kwatch
  template:
    metadata:
      labels:
        app: kwatch
      annotations:
        # Restart when the config changes (bump on edit)
        kwatch/config-rev: "1"
    spec:
      serviceAccountName: kwatch
      securityContext:
        fsGroup: 1000
      containers:
        - name: kwatch
          image: ghcr.io/abahmed/kwatch:v1.1.0
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: health
              containerPort: 8060
          env:
            - name: CONFIG_FILE
              value: /config/config.yaml
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: KWATCH_LEADER_ELECTION_NAME
              value: kwatch-leader
            - name: KWATCH_DATA_DIR
              value: /var/lib/kwatch
            - name: KWATCH_VOLUME_LIMIT
              value: 1Gi
            - name: KWATCH_MEMORY_LIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
                  divisor: "1"
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /availabilityz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: telegram
              mountPath: /secrets
              readOnly: true
            - name: data
              mountPath: /var/lib/kwatch
      volumes:
        - name: config
          configMap:
            name: kwatch
        # Created by scripts/create-alerting-secrets.sh (Telegram token + chat ID)
        - name: telegram
          secret:
            secretName: kwatch-telegram
            defaultMode: 0400
        # emptyDir instead of upstream's PVC: a Hetzner volume would pin kwatch
        # to one location (nbg1/hel1). Cost: open incidents may be re-announced
        # after a restart.
        - name: data
          emptyDir:
            sizeLimit: 1Gi
