apiVersion: apps/v1
kind: Deployment
metadata:
  name: claude-code
  namespace: claude-code
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: claude-code
  template:
    metadata:
      labels:
        app: claude-code
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude-code
          image: ghcr.io/simonfrey/hetzner_k8s/claude-code:latest
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "pgrep -x sleep > /dev/null"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: claude-home
              mountPath: /home/claude
            - name: claude-workspaces
              mountPath: /workspaces
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: claude-home
          persistentVolumeClaim:
            claimName: claude-home
        - name: claude-workspaces
          persistentVolumeClaim:
            claimName: claude-workspaces
        - name: tmp
          emptyDir: {}
