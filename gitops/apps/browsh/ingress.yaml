apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: browsh
  namespace: browsh
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: browsh-redirect-https@kubernetescrd,browsh-basic-auth@kubernetescrd
    traefik.ingress.kubernetes.io/service.serversscheme: http
    traefik.ingress.kubernetes.io/router.transport.respondingTimeouts.readTimeout: "0"
    traefik.ingress.kubernetes.io/router.transport.respondingTimeouts.idleTimeout: "0"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - browsh.tools.simon-frey.com
      secretName: browsh-tls
  rules:
    - host: browsh.tools.simon-frey.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: browsh
                port:
                  number: 7681
