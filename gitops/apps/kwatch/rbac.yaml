# kwatch v1.1.0 RBAC: the chart's "least-privilege" list with
# watch.secrets=false (no Secret access). RBAC/admission/CRD/CSR kinds are
# left out on purpose (except webhook configs, below); kwatch reports the rest
# as permission_denied and skips them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kwatch
  namespace: kwatch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kwatch
rules:
  - apiGroups: [""]
    resources: ["events", "nodes", "pods", "persistentvolumeclaims", "persistentvolumes", "configmaps", "serviceaccounts", "resourcequotas", "limitranges", "services", "replicationcontrollers"]
    verbs: ["list", "watch"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["nodes/stats", "nodes/metrics", "pods/log"]
    verbs: ["get"]
  - nonResourceURLs: ["/readyz", "/metrics"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets", "controllerrevisions"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "ingressclasses", "networkpolicies"]
    verbs: ["list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "volumeattachments"]
    verbs: ["list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["list", "watch"]
  # Broken admission webhooks are a common failure cause; without this kwatch
  # retries these two watches forever (log spam)
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectaccessreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kwatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kwatch
subjects:
  - kind: ServiceAccount
    name: kwatch
    namespace: kwatch
---
# Single-writer Lease
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kwatch-leader-election
  namespace: kwatch
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: ["kwatch-leader"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwatch-leader-election
  namespace: kwatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwatch-leader-election
subjects:
  - kind: ServiceAccount
    name: kwatch
    namespace: kwatch
---
# Restart evidence: reads its own previous pod
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kwatch-restart-evidence
  namespace: kwatch
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kwatch-restart-evidence
  namespace: kwatch
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kwatch-restart-evidence
subjects:
  - kind: ServiceAccount
    name: kwatch
    namespace: kwatch
