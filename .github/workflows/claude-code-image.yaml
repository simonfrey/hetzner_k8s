name: Claude Code Image

on:
  push:
    branches: [main]
    paths:
      - "docker/claude-code/**"
      - ".github/workflows/claude-code-image.yaml"
  pull_request:
    paths:
      - "docker/claude-code/**"
      - ".github/workflows/claude-code-image.yaml"
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: docker/claude-code
          load: true
          tags: claude-code:test

      - name: Smoke test
        run: |
          set -euo pipefail

          mkdir -p /tmp/claude-home

          # Run the container with same constraints as K8s
          docker run -d --name claude-test \
            --read-only \
            --tmpfs /tmp \
            --user 10001:10001 \
            -v /tmp/claude-home:/home/claude \
            claude-code:test

          # Wait for container to be running
          sleep 2
          if ! docker inspect claude-test --format='{{.State.Running}}' | grep -q true; then
            echo "Container crashed! Logs:"
            docker logs claude-test
            exit 1
          fi

          echo "--- Claude Code installed ---"
          docker exec claude-test claude --version

          echo "--- Running as non-root (UID 10001) ---"
          UID_VAL=$(docker exec claude-test id -u)
          [ "$UID_VAL" = "10001" ] || { echo "FAIL: UID=$UID_VAL"; exit 1; }

          echo "--- tar available (needed by kubectl cp) ---"
          docker exec claude-test tar --version > /dev/null || \
            { echo "FAIL: tar not found"; exit 1; }

          echo "All smoke tests passed!"
          docker rm -f claude-test

      # Push to GHCR only on merge to main
      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: docker/claude-code
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/claude-code:latest
            ghcr.io/${{ github.repository }}/claude-code:${{ github.sha }}
