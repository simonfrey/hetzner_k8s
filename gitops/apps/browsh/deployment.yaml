apiVersion: apps/v1
kind: Deployment
metadata:
  name: browsh
  namespace: browsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browsh
  template:
    metadata:
      labels:
        app: browsh
    spec:
      initContainers:
        - name: fetch-ttyd
          image: tsl0922/ttyd:1.7.7
          command: ["cp", "/usr/bin/ttyd", "/shared/ttyd"]
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: build-dtach
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - apk add --no-cache gcc musl-dev make && wget -O- https://github.com/crigler/dtach/archive/refs/tags/v0.9.tar.gz | tar -xz && cd dtach-0.9 && CFLAGS="-static" ./configure && make && cp dtach /shared/dtach
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: browsh
          image: browsh/browsh:v1.8.3
          command: ["/shared/ttyd"]
          args: ["-W", "-p", "7681", "/shared/dtach", "-A", "/tmp/browsh.sock", "-Ez", "browsh"]
          ports:
            - containerPort: 7681
              protocol: TCP
          volumeMounts:
            - name: shared
              mountPath: /shared
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: shared
          emptyDir: {}
