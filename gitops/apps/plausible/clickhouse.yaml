apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: plausible-clickhouse
  annotations:
    plausible/reconcile-trigger: "8"
spec:
  configuration:
    # ClickHouse's own system log tables filled the 10Gi volume (7.7GiB vs
    # 6MiB of Plausible data), which crashed Plausible's event write buffer.
    # Same approach as Plausible CE's clickhouse/logs.xml: keep a short
    # query_log for debugging, disable everything else.
    files:
      config.d/plausible-logs.xml: |
        <clickhouse>
          <query_log replace="1">
            <database>system</database>
            <table>query_log</table>
            <flush_interval_milliseconds>7500</flush_interval_milliseconds>
            <engine>ENGINE = MergeTree PARTITION BY event_date ORDER BY (event_time) TTL event_date + INTERVAL 7 DAY SETTINGS ttl_only_drop_parts=1</engine>
          </query_log>
          <metric_log remove="1"/>
          <asynchronous_metric_log remove="1"/>
          <trace_log remove="1"/>
          <text_log remove="1"/>
          <part_log remove="1"/>
          <session_log remove="1"/>
          <query_thread_log remove="1"/>
          <query_views_log remove="1"/>
          <processors_profile_log remove="1"/>
          <error_log remove="1"/>
          <latency_log remove="1"/>
          <query_metric_log remove="1"/>
          <background_schedule_pool_log remove="1"/>
          <opentelemetry_span_log remove="1"/>
          <asynchronous_insert_log remove="1"/>
          <blob_storage_log remove="1"/>
        </clickhouse>
    users:
      plausible/k8s_secret_password: plausible/plausible-credentials/CLICKHOUSE_PASSWORD
      plausible/networks/ip: "::/0"
      plausible/profile: default
      plausible/quota: default
    clusters:
      - name: plausible
        layout:
          shardsCount: 1
          replicasCount: 1
    settings:
      logger/level: warning
  defaults:
    templates:
      dataVolumeClaimTemplate: data
      podTemplate: clickhouse
  templates:
    # Pinned: ":latest" upgrades changed system log schemas and left orphaned
    # "<table>_N" copies behind. On-disk data can't be downgraded below this.
    podTemplates:
      - name: clickhouse
        spec:
          containers:
            - name: clickhouse
              image: clickhouse/clickhouse-server:26.10.3.7
              resources:
                requests:
                  cpu: 100m
                  memory: 512Mi
                limits:
                  memory: 2Gi
    volumeClaimTemplates:
      - name: data
        spec:
          storageClassName: hcloud-volumes
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 10Gi
