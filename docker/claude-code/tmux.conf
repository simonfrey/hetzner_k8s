# Large scrollback for reviewing what Claude did while disconnected
set -g history-limit 50000

# No escape delay (snappier reconnection feel)
set -g escape-time 0

# Keep sessions alive when the last client detaches
set -g destroy-unattached off

# 256-color terminal support
set -g default-terminal "tmux-256color"

# Status bar shows session name and time (confirms session is alive)
set -g status-interval 5
set -g status-left "[#S] "
set -g status-right "%H:%M"
