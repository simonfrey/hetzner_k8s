apiVersion: apps/v1
kind: Deployment
metadata:
  name: browsh
  namespace: browsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browsh
  template:
    metadata:
      labels:
        app: browsh
    spec:
      initContainers:
        - name: fetch-ttyd
          image: tsl0922/ttyd:1.7.7
          command: ["cp", "/usr/bin/ttyd", "/shared/ttyd"]
          volumeMounts:
            - name: shared
              mountPath: /shared
        - name: fetch-zellij
          image: alpine:3.20
          command: ["sh", "-c"]
          args:
            - wget -O- https://github.com/zellij-org/zellij/releases/latest/download/zellij-x86_64-unknown-linux-musl.tar.gz | tar -C /shared -xz
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: browsh
          image: browsh/browsh:v1.8.3
          command: ["/shared/ttyd"]
          env:
            - name: SHELL
              value: /usr/local/bin/browsh
            - name: ZELLIJ_CONFIG_DIR
              value: /config
          args: ["-W", "-p", "7681", "/shared/zellij", "attach", "--create", "browsh"]
          ports:
            - containerPort: 7681
              protocol: TCP
          volumeMounts:
            - name: shared
              mountPath: /shared
            - name: zellij-config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: shared
          emptyDir: {}
        - name: zellij-config
          configMap:
            name: zellij-config
