apiVersion: apps/v1
kind: Deployment
metadata:
  name: browsh
  namespace: browsh
spec:
  replicas: 1
  selector:
    matchLabels:
      app: browsh
  template:
    metadata:
      labels:
        app: browsh
    spec:
      initContainers:
        - name: fetch-ttyd
          image: tsl0922/ttyd:1.7.7
          command: ["cp", "/usr/bin/ttyd", "/shared/ttyd"]
          volumeMounts:
            - name: shared
              mountPath: /shared
      containers:
        - name: browsh
          image: browsh/browsh:v1.8.3
          command: ["/bin/bash", "-c"]
          args:
            - |
              apt-get update && apt-get install -y --no-install-recommends tmux &&
              exec /shared/ttyd -W -p 7681 tmux new-session -A -s browsh browsh
          ports:
            - containerPort: 7681
              protocol: TCP
          volumeMounts:
            - name: shared
              mountPath: /shared
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1536Mi
      volumes:
        - name: shared
          emptyDir: {}
